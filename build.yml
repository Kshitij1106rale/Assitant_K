name: Build K APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      # My zip only ships lib/ + pubspec.yaml (Dart source). This generates
      # the native android/ project (Gradle, manifest, MainActivity) around
      # it. Safe to run on an existing project: it fills in only what's
      # missing and won't touch our existing pubspec.yaml or lib/.
      - name: Scaffold native Android project
        run: flutter create --platforms=android .

      - name: Add required permissions to AndroidManifest.xml
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />' "$MANIFEST"
          cat "$MANIFEST"

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: k-assistant-apk
          path: build/app/outputs/flutter-apk/app-release.apk
